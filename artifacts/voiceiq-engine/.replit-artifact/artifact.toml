kind = "web"
previewPath = "/engine/"
title = "Neverr Voice Engine"
version = "1.0.0"
id = "artifacts/voiceiq-engine"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 23218
name = "web"
paths = ["/engine/"]

[services.development]
run = "pnpm --filter @neverr/engine run dev"

[services.env]
PORT = "23218"

[services.production]

[services.production.run]
args = ["node", "voiceiq-engine/server.js"]

[services.production.run.env]
PORT = "23218"

[services.production.health.startup]
path = "/engine/health"
